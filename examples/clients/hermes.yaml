# Hermes Agent: add under mcp_servers in config.yaml (or use
# `hermes config set`). Hermes expands ${VAR} from its own secrets.
mcp_servers:
  hub:
    url: http://127.0.0.1:18797/mcp
    headers:
      Authorization: Bearer ${AGENT_HUB_TOKEN_HERMES}
    connect_timeout: 30
    timeout: 120
    enabled: true
